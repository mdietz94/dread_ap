name: Release apworld

# Builds dread.apworld and attaches it to a GitHub Release.
#
# Triggers:
#   - Tag push matching `v*` (e.g. `git tag v0.1.0 && git push --tags`).
#   - Manual dispatch — useful for testing the build without cutting a tag.
#     The manual run uploads a workflow artifact instead of creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vendor/open-dread-rando is a pinned submodule; the patcher
          # pipeline needs it on PYTHONPATH at runtime.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Sanity: run the project's test suite before shipping a zip.
      # The apworld is the canonical artifact — if its tests are red,
      # the release would carry known-broken code.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run tests (apworld + scripts)
        run: |
          # apworld tests pull in BaseClasses / CommonClient / NetUtils
          # from Archipelago. We don't run them in CI because that would
          # require checking out the AP repo. Scripts tests are pure
          # Python and validate the patcher-pipeline conversion logic.
          python -m pytest scripts/tests/ -q

      # The compiled_rules*.json artifacts are gitignored (each 150-240k
      # lines, derived from Randovania's published logic JSON), so a fresh
      # checkout has nothing on disk. install_apworld.py regenerates them
      # during the build — but only if the Randovania logic cache exists;
      # without it _ensure_compiled_rules() warns and no-ops, producing an
      # incomplete zip that the verify step rejects. Populate the cache first
      # (network fetch of ~7.2 MB from a pinned upstream commit).
      - name: Fetch Randovania logic cache
        run: python scripts/cache_randovania_logic.py

      - name: Build apworld zip
        run: |
          mkdir -p dist
          python scripts/install_apworld.py \
            --mode apworld \
            --output dist/dread.apworld

      - name: Verify zip contents
        run: |
          python - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("dist/dread.apworld")
          names = z.namelist()
          required = [
              "dread/__init__.py",
              "dread/archipelago.json",
              "dread/World.py",
              "dread/_data_loader.py",
              "dread/patcher_pipeline.py",
              "dread/data/items.json",
              "dread/data/locations.json",
              "dread/data/regions.json",
              "dread/data/compiled_rules.json",
              "dread/data/compiled_rules_l2.json",
              "dread/data/compiled_rules_l3.json",
              "dread/data/starter_preset_patcher.json",
              "dread/client/main.py",
              "dread/client/context.py",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              print("MISSING from .apworld:", missing, file=sys.stderr)
              sys.exit(1)
          # The pycache + tests directories must NOT be in the zip.
          forbidden = [n for n in names
                       if "__pycache__" in n or n.startswith("dread/tests/")]
          if forbidden:
              print("forbidden entries in .apworld:", forbidden[:5], file=sys.stderr)
              sys.exit(1)
          print(f"OK — {len(names)} entries, all required files present.")
          PY

      # Tagged release path: publish to GitHub Releases with the apworld
      # as the only asset. The release notes pull from the tag annotation
      # if present, otherwise softprops auto-generates a changelog.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dread.apworld
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Drop a one-liner so the release page tells users what to do.
          body: |
            ## Installation

            1. Download `dread.apworld` (below) and drop it into your
               Archipelago install's `custom_worlds/` directory.
            2. Generate a multiworld using `Metroid Dread` as the game.
            3. Launch the **Dread Client** from Archipelago's Launcher (or
               open a `.dreadap` file). The window includes an AP server address
               bar, a **"Dread"** tab (live status + log), and a top-bar
               **Switch-status pill** for pointing the client at your Switch or
               Ryujinx. Click the pill → edit the IP → **Reconnect** (or use
               `/dread_connect <ip>` in the command bar).
            4. Run `/setup` in the client to build and deploy the patched
               RomFS — see the
               [first-time setup walkthrough](https://github.com/${{ github.repository }}/blob/main/docs/first-time-setup.md)
               for the click-by-click guide.

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
            for prerequisites (Switch hardware, Atmosphere CFW, Dread 2.1.0 RomFS, etc.).

      # Manual dispatch path: upload as a workflow artifact so we can
      # download + test without cutting a release tag.
      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dread.apworld
          path: dist/dread.apworld
          if-no-files-found: error
