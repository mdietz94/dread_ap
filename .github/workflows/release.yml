name: Release apworld + exlaunch sysmodule

# Builds dread.apworld AND the patched exlaunch sysmodule (subsdk9 +
# main.npdm), attaching both to a GitHub Release.
#
# The sysmodule build mirrors what `/setup` does on the user's machine:
# clone open-dread-rando-exlaunch at the pinned commit, apply our
# Ryujinx-fix patch, run `./exlaunch.sh build` under devkitPro. Shipping
# pre-built binaries is the alternative distribution channel for users
# who don't want to install devkitPro locally.
#
# Triggers:
#   - Tag push matching `v*` (e.g. `git tag v0.1.0 && git push --tags`).
#   - Manual dispatch — useful for testing the build without cutting a tag.
#     The manual run uploads workflow artifacts instead of creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to publish

jobs:
  build-apworld:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Sanity: run the project's test suite before shipping a zip.
      # The apworld is the canonical artifact — if its tests are red,
      # the release would carry known-broken code.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run tests (scripts)
        run: |
          # apworld tests pull in BaseClasses / CommonClient / NetUtils
          # from Archipelago. We don't run them in CI because that would
          # require checking out the AP repo. Scripts tests are pure
          # Python and validate the patcher-pipeline conversion logic.
          python -m pytest scripts/tests/ -q

      - name: Build apworld zip
        run: |
          mkdir -p dist
          python scripts/install_apworld.py \
            --mode apworld \
            --output dist/dread.apworld

      - name: Verify zip contents
        run: |
          python - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("dist/dread.apworld")
          names = z.namelist()
          required = [
              "dread/__init__.py",
              "dread/archipelago.json",
              "dread/World.py",
              "dread/_data_loader.py",
              "dread/patcher_pipeline.py",
              "dread/data/items.json",
              "dread/data/locations.json",
              "dread/data/regions.json",
              "dread/data/compiled_rules.json",
              "dread/data/compiled_rules_l2.json",
              "dread/data/compiled_rules_l3.json",
              "dread/data/starter_preset_patcher.json",
              "dread/client/main.py",
              "dread/client/context.py",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              print("MISSING from .apworld:", missing, file=sys.stderr)
              sys.exit(1)
          forbidden = [n for n in names
                       if "__pycache__" in n or n.startswith("dread/tests/")]
          if forbidden:
              print("forbidden entries in .apworld:", forbidden[:5], file=sys.stderr)
              sys.exit(1)
          print(f"OK — {len(names)} entries, all required files present.")
          PY

      - name: Upload apworld artifact
        uses: actions/upload-artifact@v4
        with:
          name: dread-apworld
          path: dist/dread.apworld
          if-no-files-found: error

  build-exlaunch:
    # Build the patched exlaunch sysmodule inside devkitPro's official
    # container so users get pre-built subsdk9 + main.npdm without
    # installing devkitPro locally. Mirrors the on-machine /setup flow:
    # clone -> patch -> build.
    #
    # Container: devkitpro/devkita64 ships the devkitA64 cross-compiler
    # plus the rest of the Switch toolchain pre-installed (and DEVKITPRO
    # env var set). If the image tag ever moves, pin to a specific digest
    # to keep CI reproducible.
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout dread_ap
        uses: actions/checkout@v4

      - name: Clone open-dread-rando-exlaunch at the pinned commit
        run: |
          set -e
          # Match PINNED_EXLAUNCH_COMMIT in apworld/dread/_setup/build.py.
          # If the constant changes, this step must change too — keeping
          # them in lock-step is part of the patch-bump checklist in the
          # plan doc.
          PINNED=$(python3 -c \
            "import re, pathlib;
             s = pathlib.Path('apworld/dread/_setup/build.py').read_text();
             m = re.search(r'PINNED_EXLAUNCH_COMMIT = \"([^\"]+)\"', s);
             print(m.group(1))")
          echo "Pinned commit: $PINNED"
          git clone https://github.com/randovania/open-dread-rando-exlaunch.git \
            exlaunch-checkout
          cd exlaunch-checkout
          git fetch origin
          git reset --hard "$PINNED"

      - name: Apply Ryujinx-fix patch
        run: |
          set -e
          cd exlaunch-checkout
          git apply --ignore-whitespace \
            ../scripts/patches/exlaunch-ryujinx-fix.diff
          # Sanity: the sentinel string the patch introduces must be in
          # remote_api.cpp; the local /setup uses the same probe for
          # idempotence.
          grep -q "nn::socket::Poll DOES work on Ryujinx" \
            source/program/remote_api.cpp

      - name: Build the sysmodule
        run: |
          set -e
          cd exlaunch-checkout
          ./exlaunch.sh build

      - name: Verify build outputs
        run: |
          set -e
          deploy=exlaunch-checkout/src/open_dread_rando_exlaunch/deploy
          test -f "$deploy/subsdk9"
          test -f "$deploy/main.npdm"
          echo "subsdk9:    $(stat -c%s "$deploy/subsdk9") bytes"
          echo "main.npdm:  $(stat -c%s "$deploy/main.npdm") bytes"

      - name: Stage outputs for release
        run: |
          mkdir -p dist
          cp exlaunch-checkout/src/open_dread_rando_exlaunch/deploy/subsdk9 dist/
          cp exlaunch-checkout/src/open_dread_rando_exlaunch/deploy/main.npdm dist/

      - name: Upload exlaunch artifact
        uses: actions/upload-artifact@v4
        with:
          name: exlaunch-sysmodule
          path: |
            dist/subsdk9
            dist/main.npdm
          if-no-files-found: error

  release:
    # Tagged release path: download both artifacts and publish them as
    # a single GitHub Release. Skipped on manual dispatch (those runs use
    # the artifacts uploaded by build-apworld / build-exlaunch directly).
    needs: [build-apworld, build-exlaunch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download apworld artifact
        uses: actions/download-artifact@v4
        with:
          name: dread-apworld
          path: dist/

      - name: Download exlaunch artifact
        uses: actions/download-artifact@v4
        with:
          name: exlaunch-sysmodule
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dread.apworld
            dist/subsdk9
            dist/main.npdm
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installation

            1. Download `dread.apworld` and drop it into your Archipelago
               install's `custom_worlds/` directory.
            2. Generate a multiworld using `Metroid Dread` as the game.
            3. Launch the **Dread Client** from Archipelago's Launcher
               (or double-click a `.dreadap` file).

               On first run the Kivy setup wizard pops automatically — it
               builds the patched exlaunch sysmodule and deploys it to
               Ryujinx / SD card / a custom folder. See
               [docs/first-time-setup.md](https://github.com/${{ github.repository }}/blob/main/docs/first-time-setup.md)
               for the click-by-click walkthrough.

            4. Optional: skip the sysmodule build by using the prebuilt
               `subsdk9` and `main.npdm` attached to this release.
               Drop them at one of:
               - **Ryujinx**: `%APPDATA%/Ryujinx/mods/contents/010093801237c000/DreadRandovania/exefs/`
               - **Real Switch**: `<SD>:/atmosphere/contents/010093801237c000/exefs/`

               Then run `/setup` from inside DreadClient to record your
               extracted-romfs path; the per-seed romfs patcher runs
               automatically on AP-connect.

            See the
            [install-switch.md](https://github.com/${{ github.repository }}/blob/main/docs/install-switch.md)
            backgrounder for the architecture and troubleshooting matrix.
