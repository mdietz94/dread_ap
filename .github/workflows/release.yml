name: Release apworld

# Builds dread.apworld and attaches it to a GitHub Release.
#
# NOTE: tag-push auto-publishing is DISABLED. The sysmodule build needs the
# devkitPro toolchain, whose pacman pulls its package db from
# pkg.devkitpro.org — that host sits behind Cloudflare's WAF, which 403s the
# download on GitHub-hosted (Azure) runners regardless of user-agent (it's
# IP/bot-based, not a UA spoof the dkp-apt/dkp-pacman trick can fix; see
# devkitPro/pacman#63). So the toolchain install can't run here yet.
#
# Until that's solved (e.g. lifting the prebuilt toolchain out of devkitPro's
# official Docker image `devkitpro/devkita64` via `docker cp`, or running the
# whole job in a `container:`), releases are built and published LOCALLY. Type
# the version ONCE and let scripts/release.py derive everything else — it stamps
# the apworld manifest (archipelago.json world_version + __init__.__version__),
# commits the bump, tags `vX.Y.Z`, and builds dist/dread.apworld from that tag.
#
# PREREQ: init the vendored patcher submodule first, or the build makes no zip:
#   git submodule update --init vendor/open-dread-rando
#
# Build + publish the release (publish reads straight from the tag):
#   python scripts/release.py 0.19.0 --publish   # build + commit + tag + gh release
#
# Then land the version bump on main. main is branch-protected (requires the
# `test` check), so there is NO direct push to main — the release commit rides a
# PR, auto-merged as a MERGE COMMIT (squash would orphan the tagged commit and
# leave v0.19.0 pointing off main's history):
#   git push origin v0.19.0
#   git push -u origin <release-branch>
#   gh pr create --base main --title "chore(release): v0.19.0" --body ...
#   gh pr merge --merge --auto
#
# The manifest can't drift from the tag: the version is the single input, and
# the build re-asserts world_version == __version__ before zipping. The lower-
# level pieces are still callable directly if you need them —
# scripts/set_version.py (stamp only) and
# scripts/install_apworld.py --mode apworld --version X.Y.Z (stamp + build).
#
# This workflow is kept on `workflow_dispatch` so the toolchain fix can be
# iterated without cutting a tag (manual runs upload an artifact, not a release).

on:
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # vendor/open-dread-rando is a pinned submodule; the patcher
          # pipeline needs it on PYTHONPATH at runtime.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Sanity: run the project's test suite before shipping a zip.
      # The apworld is the canonical artifact — if its tests are red,
      # the release would carry known-broken code.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run tests (apworld + scripts)
        run: |
          # apworld tests pull in BaseClasses / CommonClient / NetUtils
          # from Archipelago. We don't run them in CI because that would
          # require checking out the AP repo. Scripts tests are pure
          # Python and validate the patcher-pipeline conversion logic.
          python -m pytest scripts/tests/ -q

      # logic_graph.json is gitignored (derived from Randovania's logic JSON),
      # so a fresh checkout has nothing on disk. install_apworld.py regenerates
      # it during the build — but only if the Randovania logic cache exists;
      # without it _ensure_logic_graph() warns and no-ops, producing an
      # incomplete zip that the verify step rejects. Populate the cache first
      # (network fetch of ~7.2 MB from a pinned upstream commit).
      - name: Fetch Randovania logic cache
        run: python scripts/cache_randovania_logic.py

      # The apworld now ships a PREBUILT sysmodule (subsdk9 + main.npdm) so the
      # end-user /setup wizard needs no devkitPro / compile. install_apworld.py
      # builds it (via the exlaunch fork at PINNED_EXLAUNCH_COMMIT in
      # apworld/dread/_setup/build.py) and stages it under data/sysmodule/.
      # That build needs the devkitA64 toolchain here, and the pinned fork
      # commit must already be PUSHED to the fork's origin (the build clones it
      # and `reset --hard`s to the pin). NOTE: untested in CI as of this commit
      # — validate with a manual `workflow_dispatch` run before the first tag.
      - name: Install devkitPro (devkitA64) for the sysmodule build
        run: |
          # devkitPro's servers sit behind Cloudflare's WAF, which 403s the
          # default libcurl/wget user-agent. There are TWO hosts with TWO
          # different whitelisted UAs:
          #   - apt.devkitpro.org (bootstrap script + gpg key) → "dkp-apt"
          #   - pkg.devkitpro.org (pacman .db / .pkg downloads) → "dkp-pacman"
          # The bootstrap fetch below spoofs the first. But the .deb's
          # post-install runs `pacman -Sy`, which pulls db files from
          # pkg.devkitpro.org and 403s because the shipped pacman.conf sets no
          # UA. install-devkitpro-pacman therefore fails its configure step, so
          # we tolerate that, patch pacman's XferCommand to spoof "dkp-pacman"
          # (wget, not curl — curl gives patchy results per the maintainer),
          # then finish the configure (re-runs the now-working sync).
          # See devkitPro/pacman#63.
          wget -U "dkp-apt" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman || true
          sudo sed -i '/^\[options\]/a XferCommand = /usr/bin/wget -U "dkp-pacman" --passive-ftp -c -O %o %u' \
            /opt/devkitpro/pacman/etc/pacman.conf
          # Drop any zero-byte db partials a 403'd sync may have left behind.
          sudo rm -f /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-* \
            /var/lib/pacman/sync/dkp-* 2>/dev/null || true
          sudo dpkg --configure -a
          sudo dkp-pacman -S --noconfirm switch-dev
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/devkitA64/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Build apworld zip (includes prebuilt sysmodule)
        run: |
          mkdir -p dist
          python scripts/install_apworld.py \
            --mode apworld \
            --output dist/dread.apworld

      - name: Verify zip contents
        run: |
          python - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("dist/dread.apworld")
          names = z.namelist()
          required = [
              "dread/__init__.py",
              "dread/archipelago.json",
              "dread/World.py",
              "dread/_data_loader.py",
              "dread/patcher_pipeline.py",
              "dread/data/items.json",
              "dread/data/locations.json",
              "dread/data/regions.json",
              "dread/data/logic_graph.json",
              "dread/data/starter_preset_patcher.json",
              "dread/data/sysmodule/subsdk9",
              "dread/data/sysmodule/main.npdm",
              "dread/client/main.py",
              "dread/client/context.py",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              print("MISSING from .apworld:", missing, file=sys.stderr)
              sys.exit(1)
          # The pycache + tests directories must NOT be in the zip.
          forbidden = [n for n in names
                       if "__pycache__" in n or n.startswith("dread/tests/")]
          if forbidden:
              print("forbidden entries in .apworld:", forbidden[:5], file=sys.stderr)
              sys.exit(1)
          print(f"OK — {len(names)} entries, all required files present.")
          PY

      # Tagged release path: publish to GitHub Releases with the apworld
      # as the only asset. The release notes pull from the tag annotation
      # if present, otherwise softprops auto-generates a changelog.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/dread.apworld
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Drop a one-liner so the release page tells users what to do.
          body: |
            ## Installation

            1. Download `dread.apworld` (below) and drop it into your
               Archipelago install's `custom_worlds/` directory.
            2. Generate a multiworld using `Metroid Dread` as the game.
            3. Launch the **Dread Client** from Archipelago's Launcher (or
               open a `.dreadap` file). The window includes an AP server address
               bar, a **"Dread"** tab (live status + log), and a top-bar
               **Switch-status pill** for pointing the client at your Switch or
               Ryujinx. Click the pill → edit the IP → **Reconnect** (or use
               `/dread_connect <ip>` in the command bar).
            4. Run `/setup` in the client to build and deploy the patched
               RomFS — see the
               [first-time setup walkthrough](https://github.com/${{ github.repository }}/blob/main/docs/first-time-setup.md)
               for the click-by-click guide.

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
            for prerequisites (Switch hardware, Atmosphere CFW, Dread 2.1.0 RomFS, etc.).

      # Manual dispatch path: upload as a workflow artifact so we can
      # download + test without cutting a release tag.
      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dread.apworld
          path: dist/dread.apworld
          if-no-files-found: error
