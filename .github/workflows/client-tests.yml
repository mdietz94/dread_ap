name: Client tests

# Fast PR gate for the Python client (the PC-side bridge + AP translator).
#
# Scope is deliberately a curated subset of apworld/dread/tests/ — the client
# transport + delivery tests. These run fully standalone because
# apworld/dread/tests/conftest.py stubs out Archipelago's CommonClient /
# NetUtils, so they need neither an Archipelago checkout nor the (gitignored,
# regenerated-at-build) compiled_rules*.json artifacts. The remaining apworld
# tests are skipped here for the same reason release.yml skips them: World /
# Regions / rules tests import Archipelago's BaseClasses and/or load the
# compiled-rule data. Those stay covered by the release build, not this gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio

      - name: Run client tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            apworld/dread/tests/test_protocol.py \
            apworld/dread/tests/test_session_e2e.py \
            apworld/dread/tests/test_wire.py \
            apworld/dread/tests/test_state.py \
            apworld/dread/tests/test_bridge_server.py \
            apworld/dread/tests/test_discovery.py \
            apworld/dread/tests/test_bootstrap.py \
            apworld/dread/tests/test_datapackage.py \
            apworld/dread/tests/test_display.py \
            apworld/dread/tests/test_context_e2e.py
