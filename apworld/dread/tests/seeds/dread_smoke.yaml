name: Samus
game: Metroid Dread
description: Dread-only smoke test — single-slot, accessibility=items. The forward resolver inlines events into item-only rules and the logic-required items are classified progression, so items/full generate with no forced starting items beyond the Randovania starter set. Exercises trick level, the DNA goal, and cosmetic options.

Metroid Dread:
  accessibility: items
  starting_area: artaria
  include_boss_pickups: true
  trick_level: beginner
  required_artifacts: 3
  artifact_placement: prefer_bosses
  room_name_display: never
  raven_beak_damage_table: consistent_low
